# One section per board = the tmux session name that tmux-session-boards
# creates on its console server. `board_run -b <name>` reads that section.
#
#   host       SSH host running the tmux/serial consoles for this board
#   reset_cmd  command run by board_run to power-cycle the board.
#              {host} and {board} are substituted. Omit it if the board has
#              no remote reset - board_run then refuses --boot-log.
#
# Assumes homelab + ~/.local/share/ha.json are set up on {host}.

[gigi]
host      = raspberrypi3
reset_cmd = homelab reset {board}

