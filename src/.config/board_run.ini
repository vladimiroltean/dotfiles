# One section per board = the tmux session name that tmux-session-boards
# creates on its console server. `board_run -b <name>` reads that section.
#
#   host       SSH host running the tmux/serial consoles for this board
#   reset_cmd  command run by board_run to power-cycle the board.
#              {host} and {board} are substituted. Omit it if the board has
#              no remote reset - board_run then refuses --boot-log.
#
# Assumes homelab + ~/.local/share/ha.json are set up on {host}.

[gigi]
host      = raspberrypi3
reset_cmd = homelab reset {board}

[sara]
host      = raspberrypi3
reset_cmd = homelab reset {board}

[alpi]
host      = raspberrypi3
reset_cmd = homelab reset {board}

[mox]
host      = raspberrypi3
reset_cmd = homelab reset {board}

[fii]
host      = raspberrypi3
reset_cmd = homelab reset {board}

[black]
host      = raspberrypi3
reset_cmd = homelab reset {board}

[bluebox3]
host      = raspberrypi3
reset_cmd = homelab reset {board}

[archer-c5]
host      = raspberrypi3
reset_cmd = homelab reset {board}

[clearfog lx2]
# HA socket is registered as plain "clearfog"
host      = raspberrypi3
reset_cmd = homelab reset clearfog

[m51_s0_p0]
# HA socket is "m51"
host      = raspberrypi3
reset_cmd = homelab reset m51

[mgs_p0]
# HA socket is "sja1110-mgs"
host      = raspberrypi3
reset_cmd = homelab reset sja1110-mgs

[jonsbo]
# No smart socket - not remotely resettable.
host = raspberrypi3
